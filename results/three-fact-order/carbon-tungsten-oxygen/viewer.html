function colLabel(c){const surface=esc(c.surface).replace(/\n/g,'↵');if(c.position_kind==='filler')return `F${c.filler_ordinal}<br><code>${surface}</code><br><small>#${c.absolute_index}</small>`;if(c.position_kind==='answer_cue')return `Answer cue<br><code>${surface}</code><br><small>#${c.absolute_index}</small>`;return `Predict<br><code>${surface}</code><br><small>#${c.absolute_index}</small>`}
function targetColor(i){return colors[i%6]}
function renderLegend(){legendEl.innerHTML=labels.map((k,i)=>`<span><i class="dot" style="background:${targetColor(i)}"></i><code>${esc(k)}=${esc(DATA.expected[k])}</code> rank ≤10 or highlighted surface form</span>`).join('')+`<span><i class="dot" style="background:var(--actual)"></i>actual model row</span>`}
function hitClass(cell){const top=cell.top[0][0].trim().toLowerCase();for(let i=0;i<labels.length;i++){const r=cell.targets[labels[i]].rank,forms=(DATA.highlightForms[labels[i]]||[]).map(x=>x.trim().toLowerCase());if((r!==null&&r<=10)||forms.includes(top))return `hit${i%6}`}return ''}
function selectCell(layer,index){const c=DATA.columns[index],cell=DATA.methods[methodEl.value][layer][index];let rows=cell.top.map((t,i)=>`<tr><td>${i+1}</td><td><code>${esc(t[0]).replace(/\n/g,'↵')}</code></td><td class="num">${t[3]}</td><td class="num">${t[1].toExponential(3)}</td><td class="num">${t[2].toFixed(3)}</td></tr>`).join('');let ranks=labels.map((k,i)=>`<span style="color:${colors[i]}"><code>${esc(DATA.expected[k])}</code> rank ${cell.targets[k].rank??'n/a'}</span>`).join(' · ');detailEl.innerHTML=`<h3>${methodEl.options[methodEl.selectedIndex].text}, layer ${layer}, ${c.position_kind.replace('_',' ')} ${c.filler_ordinal??''} (token #${c.absolute_index}, <code>${esc(c.surface).replace(/\n/g,'↵')}</code>)</h3><div class="summary">${ranks}</div><table><thead><tr><th>Rank</th><th>Token</th><th class="num">ID</th><th class="num">Probability</th><th class="num">Logit</th></tr></thead><tbody>${rows}</tbody></table>`}
function selectActual(){const top=DATA.actualFinal.top,position=DATA.columns.find(c=>c.position_kind==='answer_prediction');const rows=top.map((t,i)=>`<tr><td>${i+1}</td><td><code>${esc(t[0]).replace(/\n/g,'↵')}</code></td><td class="num">${t[3]}</td><td class="num">${t[1].toExponential(3)}</td><td class="num">${t[2].toFixed(3)}</td></tr>`).join('');detailEl.innerHTML=`<h3>Actual model logits after block ${DATA.actualFinal.block} at the generation position (token #${position.absolute_index})</h3><div class="summary">Generated answer: <strong><code>${esc(DATA.actualFinal.generatedText)}</code></strong>. This is the final model output, not a lens readout.</div><table><thead><tr><th>Rank</th><th>Token</th><th class="num">ID</th><th class="num">Probability</th><th class="num">Logit</th></tr></thead><tbody>${rows}</tbody></table>`}
function renderMatrix(){const layers=shownLayers(),predictionIndex=DATA.columns.findIndex(c=>c.position_kind==='answer_prediction');let out='<div class="head">Layer</div>'+DATA.columns.map(c=>`<div class="head">${colLabel(c)}</div>`).join('');for(const l of layers){out+=`<div class="layer">L${l}</div>`;DATA.methods[methodEl.value][l].forEach((cell,i)=>{const tok=esc(cell.top[0][0]).replace(/\n/g,'↵');const ranks=labels.map(k=>`${DATA.expected[k]} rank ${cell.targets[k].rank??'n/a'}`).join(', ');out+=`<button class="cell ${hitClass(cell)}" data-layer="${l}" data-col="${i}" aria-label="Layer ${l}, ${DATA.columns[i].position_kind}, top token ${tok}; ${ranks}"><code>${tok}</code></button>`})}out+='<div class="layer actual-layer">Actual L42</div>';DATA.columns.forEach((c,i)=>{if(i===predictionIndex){const tok=esc(DATA.actualFinal.top[0][0]).replace(/\n/g,'↵');out+=`<button id="actual-final-cell" class="cell actual" aria-label="Actual model logits after block 42, top token ${tok}"><code>${tok}</code></button>`}else{out+='<div class="cell unavailable" aria-label="Actual final logits were only recorded at the generation position">—</div>'}});matrixEl.innerHTML=out;matrixEl.querySelectorAll('button.cell[data-layer]').forEach(b=>b.addEventListener('click',()=>selectCell(b.dataset.layer,Number(b.dataset.col))));document.getElementById('actual-final-cell').addEventListener('click',selectActual);selectActual();renderTargets()}
function rankStrength(r){if(r===null)return 0;return Math.max(.04,1-Math.log10(Math.max(1,r))/4)}
function renderTargets(){const layers=shownLayers(),method=DATA.methods[methodEl.value];let out='';labels.forEach((key,ki)=>{let pts=[],best=null,first=null;layers.forEach((l,li)=>{let row=method[l].slice(0,10).map(c=>c.targets[key].rank);let min=Math.min(...row.filter(r=>r!==null));if(!Number.isFinite(min))min=129280;pts.push([l,min]);row.forEach((r,p)=>{if(r!==null&&(!best||r<best.r))best={r,l,p:p+1};if(r!==null&&r<=10&&(!first||l<first.l||(l===first.l&&p+1<first.p)))first={r,l,p:p+1}})});let heat='<div class="heat-label">L/P</div>'+Array.from({length:10},(_,i)=>`<div class="heat-head">F${i+1}</div>`).join('');layers.forEach(l=>{heat+=`<div class="heat-label">${l}</div>`;method[l].slice(0,10).forEach((c,p)=>{const r=c.targets[key].rank,s=rankStrength(r);heat+=`<button class="heat-cell" style="background:color-mix(in srgb,${colors[ki]} ${Math.round(s*72)}%,transparent)" data-l="${l}" data-p="${p}" aria-label="Layer ${l}, filler ${p+1}, target rank ${r??'n/a'}">${r===null?'':r}</button>`})});const W=900,H=150,pad={l:48,r:15,t:12,b:28},x=l=>pad.l+(l-layers[0])/(layers[layers.length-1]-layers[0])*(W-pad.l-pad.r),y=r=>pad.t+Math.log10(Math.max(1,Math.min(1000,r)))/3*(H-pad.t-pad.b);const path=pts.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');const summary=`Best rank ${best?.r??'n/a'} at L${best?.l??'–'} / F${best?.p??'–'}; first rank ≤10: ${first?`L${first.l} / F${first.p} (rank ${first.r})`:'never'}`;out+=`<section class="target"><div class="target-head"><h3><code>${esc(key)}=${esc(DATA.expected[key])}</code></h3><span class="summary">${summary}</span></div><div class="heat"><div class="heat-grid">${heat}</div></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minimum filler-position rank trajectory for ${esc(DATA.expected[key])}"><line class="axis" x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}"/><line class="axis" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}"/><text class="axistext" x="8" y="18">rank 1</text><text class="axistext" x="3" y="${y(10)+4}">rank 10</text><text class="axistext" x="0" y="${y(1000)+4}">rank 1000</text><text class="axistext" x="${pad.l}" y="${H-7}">layer ${layers[0]}</text><text class="axistext" text-anchor="end" x="${W-pad.r}" y="${H-7}">layer ${layers[layers.length-1]}</text><path class="path" stroke="${colors[ki]}" d="${path}"/></svg></div></section>`});targetsEl.innerHTML=out;targetsEl.querySelectorAll('.heat-cell').forEach(b=>b.addEventListener('click',()=>selectCell(b.dataset.l,Number(b.dataset.p))))}
methodEl.addEventListener('change',renderMatrix);layersEl.addEventListener('change',renderMatrix);renderLegend();renderMatrix();
</script>
</body>
</html>
