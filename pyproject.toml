[project]
name = "jlens-filler"
version = "0.1.0"
description = "J-Lens readouts for filler-token computation in DeepSeek V4 Flash"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "numpy>=2.0",
  "plotly>=6.0",
  "safetensors>=0.7",
  "torch>=2.10",
  "transformers>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

